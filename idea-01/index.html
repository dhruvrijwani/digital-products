<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Field Edit · Fieldnote Active</title>
  <meta name="description" content="Prototype: product cards with shoppable creator clips (Loupe).">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23172229'/%3E%3Crect x='11' y='7' width='10' height='18' rx='3' fill='none' stroke='%23F6F7F4' stroke-width='2'/%3E%3Ccircle cx='16' cy='21' r='1.6' fill='%2361C08A'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
  <link rel="stylesheet" href="loupe/loupe.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#grid">Skip to products</a>

  <header class="bar">
    <a class="logo" href="#" aria-label="Fieldnote Active home">
      <span class="logo__word">Fieldnote</span><span class="logo__sub">Active</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#" aria-current="page">Train</a>
      <a href="#">Run</a>
      <a href="#">Rest</a>
    </nav>
    <div class="bar__tools">
      <button class="icon-btn" type="button" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button class="bag" id="bag" type="button" aria-label="Bag, 0 items">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 8.5h13l-1 11.5h-11l-1-11.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 8.5V7a3 3 0 0 1 6 0v1.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        <span class="bag__count" id="bagCount" aria-hidden="true">0</span>
      </button>
    </div>
  </header>

  <main class="page" id="page">
    <section class="intro" aria-labelledby="collectionTitle">
      <h1 class="intro__title" id="collectionTitle"></h1>
      <div class="intro__row">
        <p class="intro__text" id="collectionIntro"></p>
        <div class="intro__tools">
          <p class="intro__count" id="productCount"></p>
          <label class="sort">
            <span class="sort__label">Sort</span>
            <select id="sortSelect">
              <option value="featured">Featured</option>
              <option value="price-asc">Price, low to high</option>
              <option value="price-desc">Price, high to low</option>
              <option value="rating">Top rated</option>
            </select>
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </label>
        </div>
      </div>
    </section>

    <ul class="grid" id="grid" aria-label="Products"></ul>

    <footer class="foot">
      <p>Fieldnote Active is an invented brand. Clips and photos from Pexels.</p>
      <p>Product cards powered by Loupe, running on mock data.</p>
    </footer>
  </main>

  <div class="toast-region" id="toasts" aria-live="polite"></div>

  <script>
    // Read by loupe.js. In Shopify these come from the app embed or the theme settings.
    window.LoupeConfig = {
      recede: "#page",
      keepActive: ".toast-region",
      invite: true,
      wishlist: true,
      highlight: "underline",
      moneyFormat: "${{amount_no_decimals}}",
      notes: ["Free returns within 30 days", "Ships in 2 to 4 working days"],
      cart: {
        // Stand-in for Shopify's cart; app.js updates the bag when "loupe:added" fires.
        add: () => new Promise((resolve) => setTimeout(resolve, 700)),
      },
    };
  </script>
  <script src="loupe/loupe.js" defer></script>
  <script src="data/products.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
