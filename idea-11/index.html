<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>New season kit · Wildpace</title>
  <meta name="description" content="Prototype: Pip, a tiny shopping companion that reacts to how you shop.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 6c7 0 11 6 11 12s-5 9-11 9-11-3-11-9S9 6 16 6z' fill='%23ff6a1f'/%3E%3Ccircle cx='12' cy='16' r='2.2' fill='%23151515'/%3E%3Ccircle cx='20' cy='16' r='2.2' fill='%23151515'/%3E%3Cpath d='M16 6c0-3 2-4 4-5' stroke='%233fae5a' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <style>@media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } }</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="collection">
  <a class="skip" href="#grid">Skip to products</a>
  <header class="topbar">
    <a class="wordmark" href="index.html">wildpace</a>
    <nav class="topnav" aria-label="Main"><a href="index.html" aria-current="page">New in</a><a href="#">Run</a><a href="#">Train</a></nav>
    <button class="pipswitch" id="pipSwitch" type="button" role="switch" aria-checked="true" title="Show or hide Pip">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c5 0 8 4.5 8 9s-3.6 6.5-8 6.5S4 18.5 4 14s3-9 8-9z" fill="currentColor"/><circle cx="9.3" cy="13" r="1.4" fill="#fff"/><circle cx="14.7" cy="13" r="1.4" fill="#fff"/></svg>
      <span>Pip</span>
    </button>
    <a class="cartbtn" id="cartBtn" href="#" aria-label="Cart, 0 items">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.3 12H6.3L5 8Z M9 8V7a3 3 0 0 1 6 0v1" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
      <span id="cartCount">0</span>
    </a>
  </header>

  <main class="page">
    <section class="intro">
      <h1 id="pageTitle"></h1>
      <p class="intro__lede" id="pageIntro"></p>
      <p class="promo" id="promo" hidden></p>
    </section>
    <ul class="grid" id="grid" aria-label="Products"></ul>
    <footer class="foot">Wildpace is an invented store for the Pip prototype. Photos from Pexels.</footer>
  </main>

  <aside class="lab" id="lab" aria-label="Demo controls">
    <button class="lab__toggle" id="labToggle" type="button" aria-expanded="false" aria-controls="labBody">Pip Lab</button>
    <div class="lab__body" id="labBody" hidden>
      <p class="lab__hint">Hover a product and wait, then click one. Pip follows you to the product page.</p>
      <div class="lab__btns">
        <button type="button" data-lab="replay">Replay sneak-in</button>
        <button type="button" data-lab="reset">Reset demo</button>
      </div>
    </div>
  </aside>

  <p class="visually-hidden" id="liveRegion" aria-live="polite"></p>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="data/store.js"></script>
  <script src="pip.js"></script>
  <script src="app.js"></script>
</body>
</html>
